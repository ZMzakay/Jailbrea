<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Fake Jailbreak Tool</title>
    <style>
        :root {
            --bg-color: #000000;
            --card-bg: #1c1c1e;
            --text-primary: #ffffff;
            --text-secondary: #8e8e93;
            --accent-color: #0a84ff;
            --accent-hover: #0071e3;
            --border-color: #38383a;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        .app-container {
            width: 100%;
            max-width: 428px;
            height: 100vh;
            max-height: 926px;
            background-color: var(--bg-color);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 24px 20px 40px 20px;
            position: relative;
            overflow-y: auto;
        }

        /* Header Section */
        .header {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 40px;
            text-align: center;
        }

        .logo-container {
            width: 96px;
            height: 96px;
            border-radius: 22px;
            overflow: hidden;
            margin-bottom: 16px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .logo-container img {
            width: 100%;
            height: 100%;
            object-fit: cover; /* Forces 1:1 square crop behavior */
        }

        .app-title {
            font-size: 28px;
            font-weight: 700;
            letter-spacing: 0.35px;
            margin-bottom: 6px;
        }

        .app-subtitle {
            font-size: 15px;
            color: var(--text-secondary);
            font-weight: 400;
        }

        /* Device Info Card */
        .info-card {
            background-color: var(--card-bg);
            border-radius: 14px;
            padding: 16px;
            margin: 20px 0;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            font-size: 14px;
        }

        .info-label {
            color: var(--text-secondary);
        }

        .info-value {
            color: var(--text-primary);
            font-weight: 500;
        }

        /* Console Log Box */
        .console-box {
            background-color: #0c0c0e;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            height: 160px;
            padding: 12px;
            overflow-y: auto;
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            font-size: 12px;
            color: #30d158;
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .console-line {
            word-break: break-all;
        }

        .console-line.dim {
            color: var(--text-secondary);
        }

        .console-line.error {
            color: #ff453a;
        }

        /* Action Button */
        .action-button {
            width: 100%;
            background-color: var(--accent-color);
            color: white;
            border: none;
            border-radius: 14px;
            padding: 16px;
            font-size: 17px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s, opacity 0.2s;
            text-align: center;
        }

        .action-button:active {
            background-color: var(--accent-hover);
            transform: scale(0.98);
        }

        .action-button:disabled {
            background-color: #3a3a3c;
            color: var(--text-secondary);
            cursor: not-allowed;
            transform: none;
        }

        /* Footer info */
        .footer-text {
            text-align: center;
            font-size: 12px;
            color: var(--text-secondary);
            margin-top: 12px;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- Header / Logo -->
        <div class="header">
            <div class="logo-container">
                <!-- Uses IMG_1379.jpeg with 1:1 square crop handling via object-fit -->
                <img src="IMG_1379.jpeg" alt="App Logo" onerror="this.src='data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' width=\'96\' height=\'96\'><rect width=\'96\' height=\'96\' fill=\'%23333\'/><text x=\'50%\' y=\'50%\' fill=\'%23fff\' dominant-baseline=\'middle\' text-anchor=\'middle\' font-family=\'sans-serif\' font-size=\'14\'>LOGO</text></svg>'">
            </div>
            <h1 class="app-title">Palera1n-ish</h1>
            <p class="app-subtitle">Semi-tethered simulation utility</p>
        </div>

        <!-- System Configuration Details -->
        <div class="info-card">
            <div class="info-row">
                <span class="info-label">Device Model</span>
                <span class="info-value" id="device-model">iPhone (iOS Simulator)</span>
            </div>
            <div class="info-row">
                <span class="info-label">OS Version</span>
                <span class="info-value">17.5.1 (Mocked)</span>
            </div>
            <div class="info-row">
                <span class="info-label">Exploit Status</span>
                <span class="info-value" id="exploit-status" style="color: #ff453a;">Not Exploited</span>
            </div>
        </div>

        <!-- Fake Terminal Logs -->
        <div class="console-box" id="console-box">
            <div class="console-line dim">> Ready to initialize environment.</div>
            <div class="console-line dim">> Waiting for user interaction...</div>
        </div>

        <!-- Trigger Button -->
        <div>
            <button class="action-button" id="jailbreak-btn" onclick="startFakeProcess()">Start Process</button>
            <p class="footer-text">For entertainment and interface demonstration purposes only.</p>
        </div>
    </div>

    <script>
        const logs = [
            "Initializing kernel bridge...",
            "Checking device architecture (arm64e)...",
            "Bypassing trust cache policies...",
            "Injecting payload descriptors into launchd...",
            "Allocating kernel memory blocks...",
            "Triggering memory corruption routine...",
            "Attempting bridge elevation to root...",
            "Remounting root filesystem as read-write...",
            "Generating system tokens...",
            "Cleaning up temporary diagnostic files...",
            "Process completed successfully. (Fake state)"
        ];

        function startFakeProcess() {
            const btn = document.getElementById('jailbreak-btn');
            const consoleBox = document.getElementById('console-box');
            const statusLabel = document.getElementById('exploit-status');

            btn.disabled = true;
            btn.innerText = "Running...";
            statusLabel.innerText = "Exploiting...";
            statusLabel.style.color = "#ff9f0a";

            consoleBox.innerHTML = '<div class="console-line">> Starting routine sequence...</div>';

            let index = 0;
            const interval = setInterval(() => {
                if (index < logs.length) {
                    const div = document.createElement('div');
                    div.className = "console-line";
                    div.innerText = "> " + logs[index];
                    consoleBox.appendChild(div);
                    consoleBox.scrollTop = consoleBox.scrollHeight;
                    index++;
                } else {
                    clearInterval(interval);
                    btn.innerText = "Done";
                    statusLabel.innerText = "Ready (Mocked)";
                    statusLabel.style.color = "#30d158";
                    
                    const successDiv = document.createElement('div');
                    successDiv.className = "console-line";
                    successDiv.style.color = "#0a84ff";
                    successDiv.innerText = "> All operations finished safely. No system modifications were made.";
                    consoleBox.appendChild(successDiv);
                    consoleBox.scrollTop = consoleBox.scrollHeight;
                }
            }, 600);
        }
    </script>
</body>
</html>
