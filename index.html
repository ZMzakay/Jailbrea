<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>palera1n</title>
    <style>
        :root {
            --bg-color: #000000;
            --card-bg: #1c1c1e;
            --text-primary: #ffffff;
            --text-secondary: #8e8e93;
            --accent-color: #0a84ff;
            --border-color: #2c2c2e;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Helvetica Neue", sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        .container {
            width: 100%;
            max-width: 400px;
            height: 100%;
            max-height: 844px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 30px 20px 40px 20px;
        }

        .header {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 20px;
        }

        .logo {
            width: 88px;
            height: 88px;
            border-radius: 20px;
            overflow: hidden;
            margin-bottom: 16px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.4);
            border: 0.5px solid rgba(255,255,255,0.15);
        }

        .logo img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .title {
            font-size: 24px;
            font-weight: 700;
            letter-spacing: -0.4px;
        }

        .subtitle {
            font-size: 14px;
            color: var(--text-secondary);
            margin-top: 4px;
        }

        .status-card {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            border: 0.5px solid var(--border-color);
        }

        .status-row {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
        }

        .status-label {
            color: var(--text-secondary);
        }

        .status-val {
            font-weight: 500;
            color: var(--text-primary);
        }

        .console {
            background-color: #08080a;
            border: 0.5px solid var(--border-color);
            border-radius: 12px;
            height: 220px;
            padding: 12px;
            overflow-y: auto;
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            font-size: 11px;
            line-height: 1.4;
            color: #d1d1d6;
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .console-line {
            word-break: break-all;
            white-space: pre-wrap;
        }

        .options-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .option-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: var(--card-bg);
            padding: 12px 16px;
            border-radius: 10px;
            font-size: 14px;
            border: 0.5px solid var(--border-color);
        }

        .option-item input[type="checkbox"] {
            transform: scale(1.1);
            accent-color: var(--accent-color);
            cursor: pointer;
        }

        .btn {
            width: 100%;
            background-color: var(--accent-color);
            color: white;
            border: none;
            border-radius: 14px;
            padding: 16px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .btn:active {
            opacity: 0.7;
        }

        .btn:disabled {
            background-color: #2c2c2e;
            color: var(--text-secondary);
            cursor: not-allowed;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <div class="logo">
                <img src="IMG_1379.jpeg" alt="palera1n" onerror="this.src='data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' width=\'88\' height=\'88\'><rect width=\'88\' height=\'88\' fill=\'%231c1c1e\'/><text x=\'50%\' y=\'50%\' fill=\'%238e8e93\' dominant-baseline=\'middle\' text-anchor=\'middle\' font-family=\'sans-serif\' font-size=\'12\'>LOGO</text></svg>'">
            </div>
            <div class="title">palera1n</div>
            <div class="subtitle">iOS 15.0 - 17.4 (checkm8)</div>
        </div>

        <div class="status-card">
            <div class="status-row">
                <span class="status-label">Device</span>
                <span class="status-val" id="device-type">iPhone10,6 (D22AP)</span>
            </div>
            <div class="status-row">
                <span class="status-label">ECID</span>
                <span class="status-val">0x3E84F1B9C20A</span>
            </div>
            <div class="status-row">
                <span class="status-label">CPU Architecture</span>
                <span class="status-val">arm64e (A11)</span>
            </div>
            <div class="status-row">
                <span class="status-label">State</span>
                <span class="status-val" id="jailbreak-state" style="color: #ff453a;">Unrestricted/DFU Req.</span>
            </div>
        </div>

        <div class="options-group">
            <label class="option-item">
                <span>Rootful Mode</span>
                <input type="checkbox" id="rootful-toggle">
            </label>
            <label class="option-item">
                <span>Skip Setup (Safe)</span>
                <input type="checkbox" id="skip-setup" checked>
            </label>
        </div>

        <div class="console" id="console-output">
            <span class="console-line" style="color: #8e8e93;">[i] Waiting for connection over usbmux...</span>
            <span class="console-line" style="color: #8e8e93;">[i] Ready. Ensure device is connected via USB.</span>
        </div>

        <button class="btn" id="action-btn" onclick="runProcess()">Start</button>
    </div>

    <script>
        const logsSequence = [
            { text: "[*] Starting palera1n v2.0.1 (JSON Bridge)...", color: "#ffffff", delay: 400 },
            { text: "[*] Connecting to lockdownd service...", color: "#ffffff", delay: 600 },
            { text: "[*] Identifying product type: iPhone10,6", color: "#ffffff", delay: 500 },
            { text: "[*] Getting iOS build version configuration...", color: "#ffffff", delay: 400 },
            { text: "[*] Checking bootrom exploit vector (checkm8)...", color: "#0a84ff", delay: 800 },
            { text: "[*] Sending control transfer to device in normal mode...", color: "#ffffff", delay: 600 },
            { text: "[!] Please put your device into DFU mode:", color: "#ff9f0a", delay: 700 },
            { text: "[info] Holding Side Button and Volume Down (3s)...", color: "#8e8e93", delay: 1000 },
            { text: "[info] Releasing Side Button, maintaining Volume Down (10s)...", color: "#8e8e93", delay: 1200 },
            { text: "[*] DFU mode interface acquired successfully.", color: "#30d158", delay: 600 },
            { text: "[*] Exploiting SecureROM via checkm8 vulnerability...", color: "#0a84ff", delay: 1000 },
            { text: "[*] Uploading custom secondary payload (iBSS)...", color: "#ffffff", delay: 800 },
            { text: "[*] Executing payload vector inside SRAM...", color: "#ffffff", delay: 700 },
            { text: "[*] Uploading iBEC and patching kernel structures...", color: "#ffffff", delay: 900 },
            { text: "[*] Booting kernel cache with boot-args...", color: "#ffffff", delay: 800 },
            { text: "[*] Establishing bind shell / kernel patchset pipeline...", color: "#ffffff", delay: 700 },
            { text: "[*] Remounting root filesystem mount points...", color: "#ffffff", delay: 600 },
            { text: "[+] Done! Device should now be booting via custom kernel.", color: "#30d158", delay: 200 }
        ];

        function runProcess() {
            const btn = document.getElementById('action-btn');
            const consoleBox = document.getElementById('console-output');
            const stateLabel = document.getElementById('jailbreak-state');

            btn.disabled = true;
            btn.innerText = "Processing...";
            stateLabel.innerText = "Executing exploit...";
            stateLabel.style.color = "#ff9f0a";

            consoleBox.innerHTML = '';

            let currentStep = 0;

            function processNextLog() {
                if (currentStep < logsSequence.length) {
                    const log = logsSequence[currentStep];
                    const span = document.createElement('span');
                    span.className = 'console-line';
                    span.innerText = log.text;
                    span.style.color = log.color;
                    consoleBox.appendChild(span);
                    consoleBox.scrollTop = consoleBox.scrollHeight;

                    const delay = log.delay;
                    currentStep++;
                    setTimeout(processNextLog, delay);
                } else {
                    btn.innerText = "Done";
                    stateLabel.innerText = "Booted (jailbroken)";
                    stateLabel.style.color = "#30d158";
                    
                    const finalSpan = document.createElement('span');
                    finalSpan.className = 'console-line';
                    finalSpan.style.color = "#30d158";
                    finalSpan.innerText = "[*] Process execution complete.";
                    consoleBox.appendChild(finalSpan);
                    consoleBox.scrollTop = consoleBox.scrollHeight;
                }
            }

            setTimeout(processNextLog, 300);
        }
    </script>
</body>
</html>
